name: Deploy frontend

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-deploy.yml"
  workflow_dispatch:

# npm の依存パッケージやビルドが動くジョブでは OIDC トークンを発行できないようにする
# id-token: write は、ビルド結果をアップロードするだけの deploy ジョブにだけ付ける
permissions:
  contents: read

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}

      # aws s3 sync と同じ中身を渡すため、ドットで始まるファイルも含める
      - uses: actions/upload-artifact@v7
        with:
          name: frontend-out
          path: frontend/out/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      # npm やビルドは動かさず、build ジョブの成果物だけを使う
      - uses: actions/download-artifact@v8
        with:
          name: frontend-out
          path: out

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_FRONTEND_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-1

      - name: Upload to S3
        run: aws s3 sync out/ "s3://${{ vars.FRONTEND_BUCKET }}" --delete

      - name: Invalidate CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" --paths "/*"