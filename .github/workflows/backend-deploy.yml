name: Deploy backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04-arm
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-1

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}
        run: |
          docker build --platform linux/arm64 --provenance=false -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Run DB migrations
        env:
          FLYWAY_URL: ${{ vars.NEON_DIRECT_JDBC_URL }}
          FLYWAY_USER: ${{ vars.NEON_DB_USER }}
        run: |
          FLYWAY_PASSWORD=$(aws ssm get-parameter \
            --name /machi-portfolio/db-password \
            --with-decryption \
            --query Parameter.Value \
            --output text)
          echo "::add-mask::${FLYWAY_PASSWORD}"
          export FLYWAY_PASSWORD
          docker run --rm \
            -e FLYWAY_URL -e FLYWAY_USER -e FLYWAY_PASSWORD \
            -v "$PWD/src/main/resources/db/migration:/flyway/sql:ro" \
            flyway/flyway:13.10.3 migrate

      - name: Update Lambda
        env:
          FUNCTION_NAME: ${{ vars.LAMBDA_FUNCTION_NAME }}
        run: |
          aws lambda update-function-code --function-name "$FUNCTION_NAME" --image-uri "$IMAGE"
          aws lambda wait function-updated-v2 --function-name "$FUNCTION_NAME"